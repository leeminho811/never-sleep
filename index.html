<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 졸음 방지 출석 시스템 시뮬레이터</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #60a5fa; }
    .container { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
    .card {
      background: #1e293b;
      border-radius: 20px;
      padding: 20px;
      width: 300px;
      box-shadow: 0 0 20px rgba(0,0,0,0.3);
    }
    input[type=range] { width: 100%; }
    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }
    button:hover { background-color: #2563eb; }
    canvas { background: #1e293b; border-radius: 15px; padding: 10px; }
    table {
      width: 90%;
      margin: 20px auto;
      border-collapse: collapse;
      color: #f8fafc;
    }
    th, td { border: 1px solid #475569; padding: 5px; }
    th { background-color: #334155; }
  </style>
</head>
<body>
  <h1>AI 졸음 방지 출석 시스템 시뮬레이터</h1>

  <div class="container">
    <div class="card">
      <h3>졸음 감지 시뮬레이션</h3>
      <p>눈 감은 시간 (초): <span id="eyeTimeVal">0</span></p>
      <input type="range" id="eyeTime" min="0" max="15" value="0">
      <p>고개 각도 (도): <span id="angleVal">0</span></p>
      <input type="range" id="angle" min="0" max="90" value="0">
      <p>움직임 감지:</p>
      <label><input type="checkbox" id="movement"> 움직임 있음</label>
      <button id="startDetect">감지 시작</button>
      <p id="status">상태: 대기 중...</p>
    </div>

    <div class="card">
      <h3>교사용 모니터 화면</h3>
      <div id="monitor"></div>
    </div>

    <div class="card">
      <h3>카메라 테스트</h3>
      <video id="webcam" autoplay playsinline width="250" height="200" style="border-radius:10px; background:#000;"></video>
    </div>
  </div>

  <h2>출석 명단</h2>
  <table>
    <thead><tr><th>학년</th><th>반</th><th>번호</th><th>이름</th></tr></thead>
    <tbody id="studentList"></tbody>
  </table>

  <h2>졸음 감지 통계</h2>
  <canvas id="sleepChart" width="400" height="200"></canvas>

  <script>
    const students = [
      {num:1,name:'고은지'},{num:2,name:'권연서'},{num:3,name:'김가남'},{num:4,name:'김건우'},
      {num:5,name:'김나연'},{num:6,name:'김현중'},{num:7,name:'김형민'},{num:8,name:'김효민'},
      {num:9,name:'남시은'},{num:10,name:'박찬서'},{num:11,name:'박하을'},{num:12,name:'박호열'},
      {num:13,name:'성하윤'},{num:14,name:'신주아'},{num:15,name:'신채아'},{num:16,name:'심인성'},
      {num:17,name:'양지우'},{num:18,name:'이민호'},{num:19,name:'이성아'},{num:20,name:'이소이'},
      {num:21,name:'이학현'},{num:22,name:'장윤서(전출)'},{num:23,name:'정예은'},{num:24,name:'정윤호'},
      {num:25,name:'정지후'},{num:26,name:'정태윤'},{num:27,name:'조동호'},{num:28,name:'조수민'},
      {num:29,name:'조현아'},{num:30,name:'최재민'},{num:31,name:'최재성'},{num:32,name:'허민'},
      {num:33,name:'허승원'},{num:34,name:'홍성민'},{num:35,name:'강연두(전입)'}
    ];

    const tbody = document.getElementById('studentList');
    students.forEach(s => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>9</td><td>3</td><td>${s.num}</td><td>${s.name}</td>`;
      tbody.appendChild(tr);
    });

    const monitor = document.getElementById('monitor');
    const eye = document.getElementById('eyeTime');
    const angle = document.getElementById('angle');
    const move = document.getElementById('movement');
    const status = document.getElementById('status');

    let sleepData = new Array(students.length).fill(0);

    function detect(){
      const eyeTime = parseInt(eye.value);
      const headAngle = parseInt(angle.value);
      const moving = move.checked;
      document.getElementById('eyeTimeVal').textContent = eyeTime;
      document.getElementById('angleVal').textContent = headAngle;
      if(eyeTime >= 5 && headAngle >= 30 && !moving){
        status.textContent = '상태: 졸음 감지 🚨';
        status.style.color = '#f87171';
        const sleepyStudent = Math.floor(Math.random()*students.length);
        monitor.innerHTML = `<p>${students[sleepyStudent].num}번 ${students[sleepyStudent].name} 졸음 감지 🚨</p>`;
        sleepData[sleepyStudent]++;
        updateChart();
      } else {
        status.textContent = '상태: 집중 중 ✅';
        status.style.color = '#4ade80';
      }
    }

    document.getElementById('startDetect').addEventListener('click', ()=>{
      setInterval(detect, 2000); // 2초마다 감지 반복
    });

    const ctx = document.getElementById('sleepChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: students.map(s => s.num + '번'),
        datasets: [{
          label: '졸음 감지 횟수',
          data: sleepData,
          backgroundColor: '#60a5fa'
        }]
      },
      options: {
        scales: {
          x: { ticks: { color: '#e2e8f0' } },
          y: { ticks: { color: '#e2e8f0' } }
        },
        plugins: { legend: { labels: { color: '#e2e8f0' } } }
      }
    });

    function updateChart(){
      chart.data.datasets[0].data = sleepData;
      chart.update();
    }

    // 웹캠 연결 테스트
    const webcam = document.getElementById('webcam');
    navigator.mediaDevices.getUserMedia({video:true})
      .then(stream => { webcam.srcObject = stream; })
      .catch(err => { console.log('웹캠 접근 불가', err); });
  </script>
</body>
</html>
