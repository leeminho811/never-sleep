<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 졸음 방지 시스템</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h1>AI 졸음 방지 시뮬레이터 (안정판)</h1>
  <p>눈 감은 시간: <input id="eye" type="number" value="0" />초</p>
  <p>고개 각도: <input id="angle" type="number" value="0" />도</p>
  <button id="detect">감지하기</button>
  <p id="result">상태: 대기 중</p>

  <canvas id="chart" width="300" height="150"></canvas>

  <script>
    const ctx = document.getElementById('chart');
    const chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['졸음 감지 횟수'],
        datasets: [{
          label: '감지',
          data: [0],
          backgroundColor: 'skyblue'
        }]
      }
    });

    document.getElementById('detect').addEventListener('click', () => {
      const eye = Number(document.getElementById('eye').value);
      const angle = Number(document.getElementById('angle').value);
      const result = document.getElementById('result');

      if (eye >= 5 && angle >= 30) {
        chart.data.datasets[0].data[0]++;
        chart.update();
        result.textContent = '상태: 졸음 감지 🚨';
        result.style.color = 'red';
      } else {
        result.textContent = '상태: 정상';
        result.style.color = 'green';
      }
    });
  </script>
</body>
</html>
